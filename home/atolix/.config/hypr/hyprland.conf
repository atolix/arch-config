# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua



$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$menu = wofi --show drun --prompt ""

exec-once = /home/atolix/development/arch-config/quickshell/run.sh --no-duplicate --daemonize
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = awww-daemon & awww img /home/atolix/Pictures/wallpapers/v1.jpg

exec-once = fcitx5

env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = INPUT_METHOD,fcitx

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
# bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = CTRL, S, exec, python3 /home/atolix/development/arch-config/quickshell/scripts/window-switcher.py
bind = $mainMod SHIFT, 4, exec, grim -g "$(slurp)"
# bind = $mainMod, C, exec, wl-copy < /tmp/hypr_clipboard
# bind = $mainMod, V, exec, wl-paste
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
source = /home/atolix/development/arch-config/quickshell/hyprland-osd.conf

# Open all new windows as floating by default.
windowrule = match:class .*, float on
windowrule = match:class com.mitchellh.ghostty, no_blur on
windowrule = match:class chromium, no_blur on
windowrule = match:class chromium, size 1100 650
windowrule = match:class chromium, center on

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0

  col.active_border = rgba(5f73d9cc)
  col.inactive_border = rgba(30384fff)

  resize_on_border = false
}

decoration {
  rounding = 8
}

input {
  sensitivity = 0.5
  kb_options = ctrl:nocaps
# natural_scroll = true

  touchpad {
    tap-and-drag = false
    drag_lock = false
  }
}
