# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua



$mainMod = SUPER
$terminal = ghostty
$fileManager = thunar
$menu = wofi --show drun --prompt ""

exec-once = @LINUX_CONFIG_DIR@/quickshell/run.sh --no-duplicate --daemonize
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = awww-daemon & awww img @LINUX_CONFIG_DIR@/sddm/mysddm/pictures/wallpapers/v1.jpg

exec-once = fcitx5
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

env = QT_IM_MODULE,fcitx
env = GTK_THEME,Adwaita:dark
env = GTK_APPLICATION_PREFER_DARK_THEME,1
env = XMODIFIERS,@im=fcitx
env = INPUT_METHOD,fcitx

bind = $mainMod, G, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod CTRL, Q, exec, hyprlock
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
# bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, C, exec, @LINUX_CONFIG_DIR@/quickshell/scripts/clipboard-picker.sh
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = CTRL, S, exec, @LINUX_CONFIG_DIR@/quickshell/scripts/window-switcher.py
bind = $mainMod SHIFT, 4, exec, @LINUX_CONFIG_DIR@/quickshell/scripts/screenshot.sh
bind = $mainMod SHIFT, 5, exec, @LINUX_CONFIG_DIR@/quickshell/scripts/screen-record.sh
# bind = $mainMod, C, exec, wl-copy < /tmp/hypr_clipboard
# bind = $mainMod, V, exec, wl-paste
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
source = @HOME@/.config/hypr/hyprland-osd.conf

# New windows use Hyprland's tiled layout by default.
windowrule = match:class com.mitchellh.ghostty, no_blur on
windowrule = match:class chromium, no_blur on
windowrule = match:class chromium, size 1100 650
windowrule = match:class chromium, center on

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0

  col.active_border = rgba(5f73d9cc)
  col.inactive_border = rgba(30384fff)

  resize_on_border = false
}

decoration {
  rounding = 8
}

input {
  sensitivity = 0.5
  kb_options = ctrl:nocaps
# natural_scroll = true

  touchpad {
    tap-and-drag = false
    drag_lock = false
  }
}
