general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 4
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M:%S')"
    color = rgba(198, 201, 212, 1.0)
    font_size = 32
    font_family = Noto Sans Mono
    position = 0, 86
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    rounding = 6
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(65, 69, 82, 1.0)
    inner_color = rgba(34, 36, 47, 0.9)
    font_color = rgba(234, 234, 234, 1.0)
    fade_on_empty = false
    placeholder_text =
    check_color = rgba(165, 180, 252, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    position = 0, -32
    halign = center
    valign = center
}
