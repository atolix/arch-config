# Source this file instead of the existing volume/brightness bindings.
$osdControl = /home/atolix/development/quickshell-bar/scripts/osd-control.py
bindel = , XF86AudioLowerVolume, exec, $osdControl volume down
bindel = , XF86AudioRaiseVolume, exec, $osdControl volume up
bindl = , XF86AudioMute, exec, $osdControl volume mute
bindel = , XF86MonBrightnessUp, exec, $osdControl brightness up
bindel = , XF86MonBrightnessDown, exec, $osdControl brightness down
